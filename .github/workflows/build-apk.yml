name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Flutter Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 1. 겹친 하위 폴더 자동 정리 & 최신 안드로이드 Gradle 8 규격에 맞게 자동 교정
      - name: Prepare Project Structure & Fix AGP 8
        run: |
          if [ -d "school_walkon/lib" ]; then
            echo "하위 폴더 내용물을 루트로 자동 이동 중..."
            cp -r school_walkon/* .
          fi
          # AndroidManifest.xml에서 package="..." 속성 자동 제거 (Gradle 8 규격 맞춤)
          find . -name "AndroidManifest.xml" -exec sed -i 's/package="[^"]*"//g' {} + || true
          flutter create --platforms=android --org com.school .

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK (Release)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: school-walkon-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
